<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrapTime · Повышения</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    background: #0e0e14;
    color: #eaeef2;
    line-height: 1.5;
    padding: 0;
    min-height: 100vh;
}

/* ================= AUTH SCREEN ================= */
#authScreen {
    position: fixed; inset: 0; z-index: 2000;
    background: radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.18), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(110, 159, 255, 0.15), transparent 50%),
                radial-gradient(circle at 50% 50%, #1a1a2a 0%, #0a0a10 80%);
    display: flex; justify-content: center; align-items: center;
    padding: 20px;
    transition: opacity 0.6s ease, visibility 0.6s ease;
    overflow: hidden;
}
#authScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

.auth-particle {
    position: absolute; border-radius: 50%; opacity: 0.25;
    animation: authFloat linear infinite;
    filter: blur(1px);
}
@keyframes authFloat {
    0% { transform: translateY(110vh) translateX(0) scale(0); opacity: 0; }
    10% { opacity: 0.35; }
    90% { opacity: 0.35; }
    100% { transform: translateY(-20vh) translateX(50px) scale(1.4); opacity: 0; }
}

.auth-box {
    background: rgba(22, 26, 34, 0.85);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(139, 92, 246, 0.25);
    border-radius: 24px;
    padding: 40px;
    width: 100%; max-width: 440px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
    position: relative; z-index: 2;
    animation: authBoxIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
@keyframes authBoxIn {
    0% { transform: scale(0.9) translateY(20px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
}

.auth-logo {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; font-size: 26px; font-weight: 800;
    margin-bottom: 8px;
}
.auth-logo .logo-icon {
    width: 50px; height: 50px;
    background: linear-gradient(135deg, #8b5cf6, #6e9fff);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: #fff; font-weight: 900;
    box-shadow: 0 8px 24px rgba(139, 92, 246, 0.45);
}
.auth-logo .logo-text {
    background: linear-gradient(135deg, #b48aff, #6e9fff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.auth-subtitle {
    text-align: center; color: #6a7689;
    font-size: 14px; margin-bottom: 28px;
}

.auth-tabs {
    display: flex; background: #0e1219;
    border: 1px solid #272e3a;
    border-radius: 14px; padding: 5px;
    margin-bottom: 24px;
}
.auth-tab {
    flex: 1; padding: 11px; text-align: center;
    border-radius: 10px; cursor: pointer;
    font-size: 14px; font-weight: 600;
    color: #6a7689; transition: all 0.25s;
    border: none; background: transparent;
    font-family: 'Inter', sans-serif;
}
.auth-tab.active {
    background: linear-gradient(135deg, #8b5cf6, #6e9fff);
    color: #fff;
    box-shadow: 0 6px 18px rgba(139, 92, 246, 0.4);
}

.auth-form { display: flex; flex-direction: column; gap: 14px; }
.auth-form.hidden { display: none; }

.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label {
    font-size: 12px; color: #8a94a8;
    font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase;
}
.form-group input {
    padding: 14px 16px; border-radius: 12px;
    border: 1px solid #272e3a; background: #0e1219;
    color: #fff; font-size: 15px;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.form-group input:focus {
    outline: none; border-color: #8b5cf6;
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
}
.form-group input::placeholder { color: #4a5468; }

.remember-row {
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; font-size: 13px; color: #8a94a8;
    user-select: none;
}
.remember-row input { display: none; }
.remember-checkbox {
    width: 20px; height: 20px;
    border: 2px solid #8b5cf6; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    transition: 0.2s; flex-shrink: 0;
}
.remember-checkbox::after {
    content: "✓"; color: #fff; font-weight: 800;
    font-size: 12px; opacity: 0;
}
.remember-row input:checked + .remember-checkbox {
    background: linear-gradient(135deg, #8b5cf6, #6e9fff);
    border-color: transparent;
}
.remember-row input:checked + .remember-checkbox::after { opacity: 1; }

.auth-submit {
    width: 100%; padding: 15px; border-radius: 12px;
    border: none; color: #fff;
    background: linear-gradient(135deg, #8b5cf6, #6e9fff);
    font-weight: 700; font-size: 15px;
    cursor: pointer; transition: all 0.2s;
    margin-top: 8px; text-transform: uppercase;
    letter-spacing: 0.05em;
    font-family: 'Inter', sans-serif;
    box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4);
}
.auth-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(139, 92, 246, 0.55);
}

.auth-footer {
    text-align: center; margin-top: 18px;
    font-size: 13px; color: #6a7689;
}
.auth-footer a {
    color: #b48aff; text-decoration: none;
    font-weight: 600; cursor: pointer;
}
.auth-footer a:hover { text-decoration: underline; }

/* ================= NAVBAR ================= */
.navbar {
    position: sticky; top: 0; z-index: 500;
    background: rgba(14, 14, 20, 0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid #232a36;
    padding: 0.9rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem;
    opacity: 0; transition: opacity 1s ease;
}
.navbar.visible { opacity: 1; }

.nav-logo {
    font-size: 1.5rem; font-weight: 700;
    background: linear-gradient(135deg, #b48aff, #6e9fff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    display: flex; align-items: center; gap: 0.5rem;
    cursor: pointer;
}
.nav-logo i { font-size: 1.2rem; color: #b48aff; -webkit-text-fill-color: #b48aff; }

.nav-tabs {
    display: flex; gap: 0.5rem;
    background: #161a22;
    border: 1px solid #272e3a;
    border-radius: 50px;
    padding: 0.35rem;
}
.nav-tab {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.6rem 1.4rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem; font-weight: 600;
    color: #9aa4b5;
    background: transparent; border: none; border-radius: 50px;
    cursor: pointer; transition: all 0.25s ease;
    white-space: nowrap;
}
.nav-tab:hover { color: #d4dae8; background: #1f2531; }
.nav-tab.active {
    color: #fff;
    background: linear-gradient(135deg, #8b5cf6, #6e9fff);
    box-shadow: 0 6px 18px rgba(139, 92, 246, 0.45);
}

.nav-user {
    display: flex; align-items: center; gap: 10px;
}
.nav-profile-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 14px 5px 5px;
    background: #161a22;
    border: 1px solid #272e3a;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.2s;
    color: #eaeef2;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
}
.nav-profile-btn:hover {
    border-color: #8b5cf6;
    background: #1a1f29;
}
.nav-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; color: #fff;
    flex-shrink: 0;
    border: 2px solid rgba(255, 255, 255, 0.15);
    overflow: hidden;
}
.nav-avatar img { width: 100%; height: 100%; object-fit: cover; }

/* ================= PAGE CONTAINER ================= */
.page-container { padding: 2rem 1rem; display: flex; justify-content: center; }
.page-inner { max-width: 1200px; width: 100%; }

.view { display: none; }
.view.active { display: block; }

.header { text-align: center; margin-bottom: 3rem; }
.header h1 {
    font-size: 3.5rem; font-weight: 700;
    background: linear-gradient(135deg, #b48aff, #6e9fff, #a0d0ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
}
.header .sub {
    font-size: 1.2rem; color: #9aa4b5;
    border-bottom: 1px solid #2a2f3a;
    padding-bottom: 1rem; display: inline-block;
}

.section-title {
    display: flex; align-items: center; gap: 0.75rem;
    font-size: 2rem; font-weight: 600; margin: 2.5rem 0 1.5rem;
    padding-bottom: 0.5rem; border-bottom: 2px solid #2d3340;
}
.section-title i { color: #b48aff; font-size: 2rem; }
.section-title.media i { color: #ff7eb3; }
.section-title.moderation i { color: #6e9fff; }

.roles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.25rem; margin-bottom: 2rem;
}
.role-card {
    background: #161a22; border-radius: 1.25rem;
    padding: 1.5rem 1.5rem 1.8rem;
    border: 1px solid #272e3a;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
    display: flex; flex-direction: column;
}
.role-card:hover {
    transform: translateY(-4px); border-color: #3e4a5c;
    box-shadow: 0 14px 26px rgba(0, 0, 0, 0.6);
}
.role-card .role-icon {
    font-size: 2rem; margin-bottom: 0.75rem;
    width: 48px; height: 48px; display: flex;
    align-items: center; justify-content: center;
    border-radius: 12px; background: #1f2531; color: #cdd9f4;
}
.role-card.media-role .role-icon { color: #ffb0d0; background: #2a1f2a; }
.role-card.mod-role .role-icon { color: #a0c4ff; background: #1a2332; }
.role-card h3 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.5rem; }
.role-card .badge {
    display: inline-block; font-size: 0.75rem; font-weight: 600;
    padding: 0.2rem 0.7rem; border-radius: 40px;
    background: #2d3442; color: #cbd5e1; margin-bottom: 1rem;
    align-self: flex-start;
}
.role-card .requirements {
    list-style: none; margin-top: 0.5rem; margin-bottom: 1.5rem;
    flex-grow: 1;
}
.role-card .requirements li {
    display: flex; align-items: flex-start; gap: 0.5rem;
    font-size: 0.9rem; color: #b1bbcf; margin-bottom: 0.65rem;
}
.role-card .requirements li i {
    font-size: 0.8rem; margin-top: 0.25rem; color: #b48aff;
    width: 16px; text-align: center;
}
.role-card.media-role .requirements li i { color: #ff8dc7; }
.role-card.mod-role .requirements li i { color: #6e9fff; }

.card-promote-btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 0.6rem; padding: 0.85rem 1.5rem;
    font-family: 'Inter', sans-serif; font-size: 0.95rem;
    font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: #ffffff;
    background: linear-gradient(135deg, #8b5cf6, #6e9fff, #ff7eb3);
    background-size: 200% 200%;
    border: none; border-radius: 40px; cursor: pointer;
    box-shadow: 0 8px 22px rgba(139, 92, 246, 0.35);
    transition: transform 0.2s ease, box-shadow 0.3s ease;
    animation: btnGradient 5s ease infinite;
    width: 100%;
}
@keyframes btnGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
.card-promote-btn:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 14px 30px rgba(139, 92, 246, 0.6);
}

.note {
    font-size: 0.85rem; background: #1e222b;
    padding: 1rem 1.5rem; border-radius: 1.5rem;
    color: #a6b2c9; border-left: 6px solid #b48aff;
    margin-top: 2rem; display: flex; align-items: center;
    gap: 0.8rem; flex-wrap: wrap;
}
.note i { font-size: 1.4rem; color: #b48aff; }
.note.mod-note { border-left-color: #6e9fff; }
.note.mod-note i { color: #6e9fff; }

/* ================= FORUM ================= */
.forum-header { text-align: center; margin-bottom: 2rem; }
.forum-header h1 {
    font-size: 2.8rem; font-weight: 700;
    background: linear-gradient(135deg, #6e9fff, #b48aff, #ff7eb3);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
}
.forum-header .sub { color: #9aa4b5; font-size: 1.05rem; }

.forum-layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 1.5rem;
    align-items: start;
}
.forum-sidebar {
    background: #161a22;
    border: 1px solid #272e3a;
    border-radius: 1.25rem;
    padding: 0.75rem;
    position: sticky;
    top: 100px;
}
.forum-sidebar-title {
    font-size: 0.75rem; color: #6a7689;
    font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.6rem 1rem 0.5rem;
}
.forum-tab {
    display: flex; align-items: center; gap: 0.75rem;
    width: 100%; padding: 0.85rem 1rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.92rem; font-weight: 600;
    color: #9aa4b5;
    background: transparent; border: none; border-radius: 12px;
    cursor: pointer; transition: all 0.2s ease;
    text-align: left; margin-bottom: 0.25rem;
}
.forum-tab i {
    font-size: 1rem; width: 20px; text-align: center;
    color: #7a8699; transition: color 0.2s ease;
}
.forum-tab:hover { color: #eaeef2; background: #1f2531; }
.forum-tab:hover i { color: #b48aff; }
.forum-tab.active {
    color: #fff;
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(110, 159, 255, 0.2));
    border: 1px solid rgba(139, 92, 246, 0.5);
}
.forum-tab.active i { color: #b48aff; }

.forum-content { min-width: 0; }
.forum-view { display: none; }
.forum-view.active { display: block; }
</style>
</head>
<body>
